<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="300" fill="#14161a"/>

  <!-- rack-shelf texture, matching the sibling banners -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- hub mark: one index node linking out to the sibling projects -->
  <g transform="translate(38,34.5) scale(3.5)">
    <g stroke="#4aa8ff" stroke-width="2.4" stroke-opacity="0.85">
      <line x1="32" y1="32" x2="12" y2="14"/>
      <line x1="32" y1="32" x2="52" y2="14"/>
      <line x1="32" y1="32" x2="12" y2="50"/>
      <line x1="32" y1="32" x2="52" y2="50"/>
    </g>
    <circle cx="12" cy="14" r="5" fill="#4aa8ff" opacity="0.55"/>
    <circle cx="52" cy="14" r="5" fill="#4aa8ff" opacity="0.55"/>
    <circle cx="12" cy="50" r="5" fill="#4aa8ff" opacity="0.55"/>
    <circle cx="52" cy="50" r="5" fill="#4aa8ff" opacity="0.55"/>
    <circle cx="32" cy="32" r="7.5" fill="#4aa8ff"/>
  </g>

  <text x="280" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="6" fill="#f0f2f5">CYB3RRON1N</text>
  <text x="282" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#9aa1ab">Landing page for open-source projects</text>
</svg>
